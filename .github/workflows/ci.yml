name: CI

on:
  push:
    branches: [ main, "gate/**", "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan-ubsan]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libopenmpi-dev openmpi-bin clang clang-format clang-tidy libomp-dev

      - name: Configure CMake
        run: |
          cmake --preset ${{ matrix.preset }}

      - name: Build Project
        run: |
          cmake --build --preset ${{ matrix.preset }}

      - name: Run Tests (CTest)
        run: |
          ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Run MPI Executable Smoke Test
        run: |
          mpirun -np 2 --oversubscribe ./build/${{ matrix.preset == 'release' && 'release' || matrix.preset }}/heat_solver --nx=32 --ny=32 --steps=10

  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linters
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy

      - name: Check Clang-Format
        run: |
          find include src tests -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror
