# Large 3D test configuration (target: 512 x 512 x 512)
# Memory budget notice:
# Grid volume: 512^3 = 134,217,728 cells.
# At 8 bytes (double) per cell:
# - Single field buffer: 134.22 MB * 8 = 1.074 GB
# - Double-buffering (u_old, u_new): ~2.15 GB of RAM
# Ensure host machine has at least 4 GB free RAM before executing.
dimension = 3
nx = 512
ny = 512
nz = 512
alpha = 1.0
dt = 0.0000005
steps = 50
boundary = dirichlet
initial_condition = sine
overlap = true
snapshot_freq = 0
